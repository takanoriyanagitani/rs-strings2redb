[package]
name = "rs-strings2redb"
version = "0.1.0"
edition = "2024"

exclude = [
]

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "strings2redb"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[dependencies.redb]
version = "4.3.0"
default-features = false
features = [
  "std",
]
